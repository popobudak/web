<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - License Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .main-card {
            background: rgba(30, 41, 55, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .stat-number { font-size: 2.8rem; font-weight: 700; }
        .btn-action {
            padding: 16px 24px;
            font-size: 1.1rem;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="main-card p-5 mb-5">
            <div class="d-flex justify-content-between align-items-center">
                <h1><i class="fas fa-shield-alt text-primary"></i> License Manager</h1>
                <div class="text-end">
                    <div id="liveTime" class="fw-bold"></div>
                    <small>IP Kamu: <strong>{{ client_ip }}</strong></small>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-3 col-6"><div class="main-card p-4 text-center"><h3 class="stat-number">{{ total_key }}</h3><p>Total Lisensi</p></div></div>
            <div class="col-md-3 col-6"><div class="main-card p-4 text-center"><h3 class="stat-number text-success">{{ used_key }}</h3><p>Lisensi Aktif</p></div></div>
            <div class="col-md-3 col-6"><div class="main-card p-4 text-center"><h3 class="stat-number">{{ total_user }}</h3><p>User Aktif</p></div></div>
            <div class="col-md-3 col-6"><div class="main-card p-4 text-center"><h3 class="stat-number">{{ total_machine }}</h3><p>Machine Binding</p></div></div>
        </div>

        <!-- Tombol Jauh & Profesional -->
        <div class="row mt-5 g-4">
            <div class="col-md-6">
                <a href="/admin" class="btn btn-primary btn-action w-100">
                    <i class="fas fa-cogs me-2"></i> Kelola Semua Lisensi
                </a>
            </div>
            <div class="col-md-6">
                <a href="/admin/generate-custom" class="btn btn-success btn-action w-100">
                    <i class="fas fa-plus me-2"></i> Generate Lisensi Baru
                </a>
            </div>
        </div>
    </div>

    <script>
        function updateLiveTime() {
            document.getElementById('liveTime').textContent = new Date().toLocaleString('id-ID');
        }
        setInterval(updateLiveTime, 1000);
        updateLiveTime();
    </script>
</body>
</html>
