<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Lisensi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .card {
            background: rgba(30, 41, 55, 0.95);
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card p-4 p-md-5">
                    <h2 class="text-center mb-4">
                        <i class="fas fa-shield-alt me-2"></i>Cek Status Lisensi
                    </h2>
                    
                    <form id="checkForm">
                        <div class="input-group mb-3">
                            <input type="text" id="licenseKey" class="form-control form-control-lg" 
                                   placeholder="Masukkan License Key (contoh: ABCD-EFGH-...)" required>
                            <button class="btn btn-primary btn-lg" type="submit">
                                <i class="fas fa-search"></i> Cek
                            </button>
                        </div>
                    </form>

                    <div id="result" class="result d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const key = document.getElementById('licenseKey').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!key) return;

            try {
                const res = await fetch(`/check-license?key=${encodeURIComponent(key)}`);
                const data = await res.json();

                resultDiv.classList.remove('d-none');
                
                if (data.status === 'success') {
                    const statusColor = data.is_used ? 'danger' : 'success';
                    const statusText = data.is_used ? 'SUDAH DIGUNAKAN' : 'BELUM DIGUNAKAN';
                    
                    resultDiv.innerHTML = `
                        <div class="alert alert-${statusColor}">
                            <h5><strong>${statusText}</strong></h5>
                            <hr>
                            <p><strong>Key:</strong> <code>${data.key}</code></p>
                            ${data.is_used ? `
                            <p><strong>Digunakan oleh:</strong> ${data.used_by_name || 'Tidak diketahui'}</p>
                            <p><strong>Chat ID:</strong> ${data.used_by_chat_id || '-'}</p>
                            <p><strong>Tanggal Aktif:</strong> ${data.used_at || '-'}</p>
                            ` : ''}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-warning">
                            <h5>${data.message}</h5>
                        </div>
                    `;
                }
            } catch (err) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        Terjadi kesalahan saat menghubungi server.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
