<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate License</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); color: #e2e8f0; }
        .main-card { background: rgba(30, 41, 55, 0.98); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="main-card p-5">
            <div class="text-center mb-4">
                <h2><i class="fas fa-magic text-primary"></i> Generate License Key</h2>
                <p class="text-muted">Buat lisensi baru dengan cepat</p>
            </div>

            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Pilih Tipe Generate</label>
                    <select name="mode" id="modeSelect" class="form-select">
                        <option value="auto">🔄 Generate Otomatis</option>
                        <option value="custom">✍️ Generate Custom (Nama Sendiri)</option>
                    </select>
                </div>

                <div class="mb-4" id="amountField">
                    <label class="form-label">Jumlah Lisensi</label>
                    <input type="number" name="amount" class="form-control" value="10" min="1" max="100">
                </div>

                <div class="mb-4" id="customField" style="display:none;">
                    <label class="form-label">Nama Lisensi</label>
                    <input type="text" name="prefix" class="form-control" placeholder="Contoh: PREMIUM VIP">
                </div>

                <button type="submit" class="btn btn-success w-100 py-3">
                    <i class="fas fa-bolt"></i> Generate Lisensi
                </button>
            </form>
        </div>

        {% if success %}
        <div class="main-card mt-4 p-4">
            <h4 class="text-success text-center">✅ Berhasil Generate {{ keys|length }} Lisensi</h4>
            {% for key in keys %}
            <div class="bg-dark p-3 rounded mt-3"><code>{{ key }}</code></div>
            {% endfor %}
            <a href="/admin" class="btn btn-primary w-100 mt-4">Kembali ke Admin</a>
        </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('modeSelect').addEventListener('change', function() {
            document.getElementById('amountField').style.display = this.value === 'custom' ? 'none' : 'block';
            document.getElementById('customField').style.display = this.value === 'custom' ? 'block' : 'none';
        });
    </script>
</body>
</html>
