<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate License Key - iVAS License Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --dark: #1e2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
            color: #1e2937;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .generate-container {
            background: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background: #15803d;
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
        }
        .back:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="generate-container">
        <h1><i class="fas fa-key"></i> Generate License Key</h1>
        
        <form method="POST" action="/admin/generate">
            <div class="form-group">
                <label>Jumlah Key</label>
                <input type="number" name="amount" value="5" min="1" max="100" required>
            </div>
            
            <div class="form-group">
                <label>Prefix (opsional)</label>
                <input type="text" name="prefix" placeholder="contoh: IVAS2026" maxlength="15">
            </div>
            
            <button type="submit" class="btn">
                <i class="fas fa-bolt"></i> Generate Sekarang
            </button>
        </form>
        
        <a href="/admin" class="back">
            ← Kembali ke Dashboard Admin
        </a>
    </div>
</body>
</html>
